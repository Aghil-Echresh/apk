<!doctype html><html lang='fa' dir='rtl'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><meta name='theme-color' content='#0f172a'><link rel='manifest' href='manifest.webmanifest'><link rel='stylesheet' href='style.css'><title>سوپرمارکت کمیل</title></head><body><header><b>🛒 سوپرمارکت کمیل</b><div><button id='auth'>ورود</button><button id='orders' hidden>مدیریت</button><button id='cart'>🛒 <i id='count'>0</i></button></div></header><main><section class='hero'><span>فروشگاه محلی شما</span><h1 id='name'>سوپرمارکت کمیل</h1><p id='meta'>در حال بارگذاری...</p><a id='map' target='_blank'>📍 مسیر فروشگاه</a></section><section><h2>دسته‌بندی‌ها</h2><div id='cats' class='cats'></div></section><section><div class='row'><h2>محصولات</h2><input id='search' placeholder='جستجو...'></div><div id='products' class='grid'></div><p id='empty' class='empty' hidden>هنوز محصولی ثبت نشده است.</p></section></main><dialog id='authBox'><form id='authForm'><button type='button' data-close='authBox'>×</button><h2 id='authTitle'>ورود</h2><input id='email' type='email' placeholder='ایمیل' required><button class='primary'>ارسال لینک ورود</button><p id='authMsg'></p></form></dialog><dialog id='cartBox'><div class='dialog'><button data-close='cartBox'>×</button><h2>سبد خرید</h2><div id='cartItems'></div><strong id='total'></strong><button id='checkout' class='primary'>ثبت سفارش</button></div></dialog><dialog id='adminBox'><div class='dialog'><button data-close='adminBox'>×</button><h2>مدیریت فروشگاه</h2><button id='addProduct' class='primary'>＋ محصول جدید</button><div id='adminList'></div></div></dialog><dialog id='productBox'><form id='productForm'><button type='button' data-close='productBox'>×</button><h2>محصول جدید</h2><input id='pname' placeholder='نام محصول' required><input id='pprice' type='number' min='0' placeholder='قیمت' required><input id='pstock' type='number' min='0' value='1' placeholder='موجودی' required><select id='pcat' required></select><input id='pimg' placeholder='لینک تصویر، اختیاری'><textarea id='pdesc' placeholder='توضیحات'></textarea><button class='primary'>ذخیره</button><p id='pmsg'></p></form></dialog><script type='module' src='app.js'></script></body></html>
