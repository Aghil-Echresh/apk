<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827"><meta name="description" content="دستیار هوش مصنوعی فارسی مبتنی بر GGUF و llama.cpp">
<link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css">
<title>Qwen AI • دستیار هوشمند</title>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><strong>🤖 Qwen AI</strong><span>دستیار هوشمند پروژه APK</span></div>
  <div class="header-actions"><span id="status" data-state="ready" class="status"><i></i><b id="statusText">آماده</b></span><button id="settingsBtn" class="icon" aria-label="تنظیمات">⚙️</button></div>
</header>
<main id="chat" class="chat">
<section class="welcome">
  <div class="logo">✦</div><h1>سلام عقیل 👋</h1>
  <p>چت هوش مصنوعی فارسی، با رابط PWA و آماده اتصال به GGUF / llama.cpp.</p>
  <div class="chips"><button data-prompt="یک API با FastAPI بساز">ساخت API با FastAPI</button><button data-prompt="این کد JavaScript را توضیح بده">توضیح JavaScript</button><button data-prompt="یک صفحه ورود Responsive بساز">ساخت صفحه Responsive</button></div>
</section>
</main>
<form id="composer"><textarea id="input" rows="1" placeholder="پیامت را بنویس…" autocomplete="off"></textarea><button id="send" type="submit" aria-label="ارسال">➤</button></form>
</div>
<dialog id="settings">
<form method="dialog"><h2>⚙️ تنظیمات هوشمند</h2>
<label>API URL<input id="apiUrl" value="https://aghill-apk.hf.space/v1/chat/completions" inputmode="url"></label>
<label>Model<input id="model" value="qwen2.5-coder"></label>
<div class="grid"><label>Temperature<input id="temperature" type="number" min="0" max="2" step="0.1" value="0.2"></label><label>Max tokens<input id="maxTokens" type="number" min="64" max="8192" step="64" value="1024"></label></div>
<p class="hint">رابط برنامه و تاریخچه گفتگو آفلاین هم در دسترس می‌ماند. برای پاسخ واقعی مدل باید API، Worker، Space یا llama.cpp در دسترس باشد.</p>
<div class="settings-actions"><button id="testBtn" type="button">🔌 تست اتصال</button><button id="clearBtn" type="button">🗑️ پاک‌کردن تاریخچه</button></div>
<menu><button type="submit">بستن</button><button id="save" value="default" type="submit">ذخیره</button></menu>
</form></dialog>
<script type="module" src="app.js"></script>
</body></html>
