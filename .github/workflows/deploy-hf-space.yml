name: Deploy Hugging Face Space
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "huggingface-space/**"
      - ".github/workflows/deploy-hf-space.yml"
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugging Face Hub
        run: python -m pip install --upgrade huggingface_hub
      - name: Deploy existing Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE_ID: Aghill/apk
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo "::error::HF_TOKEN is not configured."
            exit 1
          fi
          python - <<'PY'
          import os
          from huggingface_hub import HfApi
          api = HfApi(token=os.environ["HF_TOKEN"])
          repo_id = os.environ["HF_SPACE_ID"]
          api.create_repo(repo_id=repo_id, repo_type="space", space_sdk="gradio", exist_ok=True)
          api.upload_folder(repo_id=repo_id, repo_type="space", folder_path="huggingface-space", commit_message="Deploy Qwen GGUF web API")
          print("Deployed:", f"https://huggingface.co/spaces/{repo_id}")
          PY
