name: Validate Web
on:
  pull_request:
    paths: ["web/**", "huggingface-space/**"]
  push:
    branches: [main]
    paths: ["web/**", "huggingface-space/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: Python syntax
        run: python -m py_compile huggingface-space/app.py
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - name: JavaScript syntax
        run: node --check web/app.js
      - name: Static files
        run: test -s web/index.html && test -s web/style.css && test -s web/manifest.webmanifest
