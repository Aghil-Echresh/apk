name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CAPACITOR_SERVER_URL: ${{ vars.CAPACITOR_SERVER_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract original workspace
        run: |
          mkdir -p .build/source
          unzip -q source/grok-workspace-1.zip -d .build/source
          shopt -s dotglob
          cp -a .build/source/. ./
          rm -rf .build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Install Capacitor
        run: npm install --no-save @capacitor/core @capacitor/cli @capacitor/android

      - name: Verify production build
        run: npm run build

      - name: Validate Android target URL
        run: |
          if [ -z "$CAPACITOR_SERVER_URL" ]; then
            echo "::error::Repository variable CAPACITOR_SERVER_URL is not set."
            echo "Set it to the deployed HTTPS URL of the app before building the Android APK."
            exit 1
          fi

      - name: Create Android project
        run: npx cap add android --no-interactive

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
