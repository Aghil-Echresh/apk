name: Validate GGUF Worker

on:
  pull_request:
    paths:
      - 'worker/**'
  push:
    branches:
      - worker/gguf-github-agent
    paths:
      - 'worker/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m py_compile worker/gguf_worker.py
