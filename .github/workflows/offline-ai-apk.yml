name: Build Offline AI APK

on:
  push:
    paths:
      - 'offline-ai/**'
      - '.github/workflows/offline-ai-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: offline-ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "cmake;3.31.6" "ndk;29.0.13113456"

      - name: Bootstrap llama.cpp
        run: ./scripts/bootstrap-llama.sh

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aghil-ai-offline-debug
          path: offline-ai/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
