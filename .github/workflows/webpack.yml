name: Build Walkie-Talkie web assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  vite:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkie-talkie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: walkie-talkie/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm run build
      - run: test -s dist/index.html
