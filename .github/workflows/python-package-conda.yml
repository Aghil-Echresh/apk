name: Validate Python sources

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile tracked Python sources
        run: |
          git ls-files -z -- '*.py' | xargs -0 -r python -m py_compile
