name: Build Walkie-Talkie Android APK
on:
  workflow_dispatch:
  push:
    paths:
      - "walkie-talkie/**"
      - ".github/workflows/android.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: walkie-talkie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build web assets
        run: npm run build
      - name: Add Android platform
        run: npx cap add android
      - name: Sync Android
        run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aghil-walkie-talkie-debug-apk
          path: walkie-talkie/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14